[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mepdiff"
version = "0.0.0"
description = "A semantic diff for MEP system topology."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The BIM Coordinator" }]
keywords = ["bim", "ifc", "mep", "hvac", "diff", "topology", "aec"]

# Upper bound is not premature caution: IfcOpenShell 0.8.x declares
# requires-python ">=3.9,<3.13", and it is the core dependency of the IFC
# adapter (M2). Revisit when IfcOpenShell publishes 3.13+ wheels.
requires-python = ">=3.11,<3.13"

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

dependencies = [
  # Validation at the adapter boundary, and a JSON Schema for the archival
  # format. See ADR-0004.
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/DaltonGOO/mepdiff"
Repository = "https://github.com/DaltonGOO/mepdiff"
Issues = "https://github.com/DaltonGOO/mepdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mepdiff"]


# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "ARG",  # unused arguments
  "SIM",  # flake8-simplify
  "PTH",  # use pathlib
  "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
docstring-code-format = true


# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]


# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=mepdiff",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/mepdiff"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
